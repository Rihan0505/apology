<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Princess ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     OPENING
========================= -->

<div class="start" id="start">

    <div class="startCard">

        <div class="tiny">
            A LITTLE MOMENT
        </div>

        <h1>For You</h1>

        <div class="goldLine"></div>

        <p>
            just take a moment...
        </p>

        <button id="begin">
            BEGIN
        </button>

    </div>

</div>


<!-- =========================
     CINEMATIC WORLD
========================= -->

<div class="world" id="world">

    <div class="stars" id="stars"></div>

    <div class="nebula nebula1"></div>
    <div class="nebula nebula2"></div>

    <div class="moonGlow"></div>

    <div class="moon"></div>

    <div class="lightRay ray1"></div>
    <div class="lightRay ray2"></div>

    <div class="horizon"></div>

</div>


<!-- MOUSE LIGHT -->

<div id="mouseLight"></div>


<!-- =========================
     STORY
========================= -->

<div class="story">

    <div id="eyebrow" class="eyebrow">
        FROM MY HEART
    </div>

    <h2 id="title" class="title">
        I'm Sorry.
    </h2>

    <div id="line" class="line"></div>

    <p id="message" class="message"></p>

</div>


<!-- =========================
     FINAL
========================= -->

<div id="final" class="final">

    <div class="finalBox">

        <div class="finalGlow"></div>

        <h2>
            Maaf Kar Dalo Naa... 🥺❤️
        </h2>

        <div class="finalLine"></div>

        <p
            id="finalMessage"
            class="finalMessage">
        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
